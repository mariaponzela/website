{{ with .Params.footer }}
<footer class="site-footer">
  <div class="shell">
    <div class="footer-top">
      <p class="eyebrow">{{ .eyebrow }}</p>
      <div class="footer-invitation">
        <h2>{{ .title }}</h2>
        <a class="button" href="{{ .button_url }}">{{ .button_text }} <span aria-hidden="true">↗</span></a>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="footer-signature"><span class="brand-mark" aria-hidden="true">MP</span><span>© María Ponzela</span></div>
      <nav class="footer-links" aria-label="Footer navigation">
        {{ range .links }}
        <a href="{{ if hasPrefix .url "/" }}{{ .url | relURL }}{{ else }}{{ .url }}{{ end }}"{{ if hasPrefix .url "http" }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .text }}</a>
        {{ end }}
      </nav>
      <span class="footer-location">Madrid, Spain</span>
    </div>
  </div>
</footer>
{{ end }}
