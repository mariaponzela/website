[tox]
envlist = site-html
skip_missing_interpreters = true

[testenv]
description = Run Hugo site tasks
basepython = python3
skip_install = true
change_dir = {toxinidir}
allowlist_externals = hugo

[testenv:site-{clean,html,serve,debug}]
description =
    clean: Remove generated website files
    html: Build the production website
    serve: Serve the website locally
    debug: Serve with full renders and caches disabled
commands =
    clean: python -c "import shutil, sys; shutil.rmtree(sys.argv[1], ignore_errors=True)" "{toxinidir}/public"
    html: hugo --minify {posargs}
    serve: hugo server -p 1313 {posargs}
    debug: hugo server -p 1313 --disableFastRender --renderToMemory --noHTTPCache --ignoreCache {posargs}
